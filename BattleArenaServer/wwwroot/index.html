<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="css/index.css">
    <link href='https://fonts.googleapis.com/css?family=Raleway:300' rel='stylesheet' type='text/css'>
</head>
<body>

    <div class="container">
        <div>
            <button id="btn_create" class="btn-lobby" onclick="createLobby()"><img class="btn-img" src="icons/Add.png" />Создать лобби</button>
            <button id="btn_refresh" class="btn-lobby" onclick="sendLobbies()"><img class="btn-img" src="icons/refresh.png" />Обновить</button>
        </div>
        <div id="lobbiesDiv" class="lobbies-div">

        </div>
    </div>

    <div id="createLobby" class="lobby-form" style="visibility: collapse;">
        <div>
            <div class="lobby-form-box"><p>Создание лобби</p></div>
            <div class="lobby-form-box">
                <label for="text-input">Название:</label>
                <input id="createLobbyName" placeholder="Не менее 3-х символов" />
            </div>
            <div id="createLobbyErrors" class="lobby-form-errors">
            </div>
            <div class="lobby-form-box">
                <button type="submit" class="lobby-form-btn" onclick="createLobbyHandler()">Подтвердить</button>
                <button type="reset" class="lobby-form-btn cancel" onclick="cancelCreateLobby()">Отмена</button>
            </div>
        </div>
    </div>

    <div id="enterNicknameForm" class="lobby-form" style="visibility: collapse;">
        <div>
            <div class="lobby-form-box"><p>Придумайте никнейм</p></div>
            <div class="lobby-form-box">
                <label for="text-input">Никнейм:</label>
                <input id="enterNickname" placeholder="Не менее 3-х символов" />
            </div>
            <div id="enterNicknameErrors" class="lobby-form-errors">
            </div>
            <div class="lobby-form-box">
                <button type="submit" class="lobby-form-btn" onclick="setUserNickname()">Подтвердить</button>
                <button id="enterNicknameCancel" type="reset" class="lobby-form-btn cancel" onclick="cancelEditUserNickname()">Отмена</button>
            </div>
        </div>
    </div>

    <div class="user-hello">
        <div style="display: flex; align-items: center;">
            <div id="userHello" style="margin-right: 20px;"></div>
            <button class="user-edit-btn" onclick="editUserNickname()"><img style="width: 32px;" src="icons/edit.png" /></button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.js"></script>
    <script src="/js/actions.js"></script>
    <script src="/js/lobby.js"></script>
</body>
</html>
